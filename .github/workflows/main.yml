
name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    - cron:  '0 0 * * *'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install broker
      run: |
        docker pull opendxl/opendxl-broker
        docker run -d -p 8883:8883 -p 8443:8443 opendxl/opendxl-broker
        docker ps -a

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        # The fork builds fix msgpack >= 1.0 (client) and the pkg_resources import (bootstrap)
        pip install "dxlclient @ git+https://github.com/derjochenmueller/opendxl-client-python@epo-legacy"
        pip install "dxlbootstrap @ git+https://github.com/derjochenmueller/opendxl-bootstrap-python@master"
        pip install wheel
        pip install .[test]

    - name: Provision client
      run: |
        python -m dxlclient provisionconfig sample localhost client -u admin -p password
        cat sample/dxlclient.config

    - name: Execute CI
      run: |
        python -m dxlmaxmindservice sample || true
        sed -i 's/licenseKey=/licenseKey=${{ secrets.MAXMIND_LICENSE_KEY }}/g' sample/dxlmaxmindservice.config
        python -m pytest tests
